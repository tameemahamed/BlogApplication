@if (canUpvote()) {
    <button
        type="button"
        class="btn btn-sm"
        [class.btn-default]="!isUpvoted"
        [class.btn-primary]="isUpvoted"
        [disabled]="toggling"
        (click)="toggle()">
        {{ (isUpvoted ? 'Upvoted' : 'Upvote') | localize }} ({{ count }})
    </button>
} @else {
    <span class="text-muted">{{ count }} {{ 'Upvotes' | localize }}</span>
}
