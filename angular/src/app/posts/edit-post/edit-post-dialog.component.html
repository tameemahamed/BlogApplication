<form class="form-horizontal" autocomplete="off" #postForm="ngForm" (ngSubmit)="save(false)">
    <abp-modal-header [title]="'EditPost' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        @if (status === 3 && rejectionReason) {
            <div class="border rounded p-2 mb-3">
                <strong>{{ 'RejectionFeedback' | localize }}</strong>
                <p class="mb-0 text-muted">{{ rejectionReason }}</p>
            </div>
        }
        <div class="form-group row">
            <label class="col-md-3 col-form-label">
                {{ 'PostStatus' | localize }}
            </label>
            <div class="col-md-9 pt-2">
                <span class="text-muted">{{ getStatusLabel() }}</span>
                @if (status === 2) {
                    <p class="mb-0 text-muted small">
                        {{ 'ApprovedPostEditHint' | localize }}
                    </p>
                }
            </div>
        </div>
        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="title">
                {{ 'PostTitle' | localize }}
            </label>
            <div class="col-md-9">
                <input
                    type="text"
                    class="form-control"
                    name="title"
                    id="title"
                    required
                    maxlength="200"
                    [(ngModel)]="post.title"
                    #titleModel="ngModel"
                    #titleEl />
                <abp-validation-summary [control]="titleModel" [controlEl]="titleEl"></abp-validation-summary>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="excerpt">
                {{ 'PostExcerpt' | localize }}
            </label>
            <div class="col-md-9">
                <textarea
                    class="form-control"
                    name="excerpt"
                    id="excerpt"
                    rows="2"
                    maxlength="500"
                    [(ngModel)]="post.excerpt"></textarea>
            </div>
        </div>
        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="contentMarkdown">
                {{ 'PostContent' | localize }}
            </label>
            <div class="col-md-9">
                <div class="d-flex justify-content-end mb-1">
                    <div class="btn-group">
                        <button
                            type="button"
                            class="btn btn-sm"
                            [class.btn-primary]="!previewMode"
                            [class.btn-default]="previewMode"
                            (click)="previewMode = false">
                            {{ 'Write' | localize }}
                        </button>
                        <button
                            type="button"
                            class="btn btn-sm"
                            [class.btn-primary]="previewMode"
                            [class.btn-default]="!previewMode"
                            (click)="previewMode = true">
                            {{ 'Preview' | localize }}
                        </button>
                    </div>
                </div>
                <textarea
                    class="form-control"
                    name="contentMarkdown"
                    id="contentMarkdown"
                    rows="12"
                    required
                    maxlength="50000"
                    [class.d-none]="previewMode"
                    [(ngModel)]="post.contentMarkdown"
                    #contentModel="ngModel"
                    #contentEl></textarea>
                @if (previewMode) {
                    <div
                        class="markdown-preview border rounded p-3"
                        [innerHtml]="post.contentMarkdown | markdown"></div>
                }
                <abp-validation-summary [control]="contentModel" [controlEl]="contentEl"></abp-validation-summary>
            </div>
        </div>
    </div>
    <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-default" [disabled]="saving" (click)="bsModalRef.hide()">
            {{ 'Cancel' | localize }}
        </button>
        <div>
            @if (canSubmit) {
                <button
                    type="button"
                    class="btn btn-default mr-1"
                    [disabled]="!postForm.form.valid || saving"
                    (click)="save(false)">
                    {{ 'Save' | localize }}
                </button>
                <button
                    type="button"
                    class="btn btn-primary"
                    [disabled]="!postForm.form.valid || saving"
                    (click)="save(true)">
                    {{ 'SubmitForReview' | localize }}
                </button>
            } @else {
                <button
                    type="button"
                    class="btn btn-primary"
                    [disabled]="!postForm.form.valid || saving"
                    (click)="save(false)">
                    {{ 'Save' | localize }}
                </button>
            }
        </div>
    </div>
</form>
